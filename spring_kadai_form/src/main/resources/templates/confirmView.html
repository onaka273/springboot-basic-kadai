<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>確認画面</title>
</head>
<body>
<h2>入力内容の確認</h2>

<p>お名前：<span th:text="${contactForm.name}"></span></p>
<p>メールアドレス：<span th:text="${contactForm.email}"></span></p>
<p>お問い合わせ内容：<span th:text="${contactForm.message}"></span></p>

<form th:action="@{/contact/submit}" th:object="${contactForm}" method="post">
    <input type="hidden" th:field="*{name}">
    <input type="hidden" th:field="*{email}">
    <input type="hidden" th:field="*{message}">
    <button type="submit">送信する</button>
</form>

</body>
</html>
