<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>確認画面</title>
</head>
<body>
<h2>入力内容をご確認ください。</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>お名前</th>
        <td th:text="${contactForm.name}"></td>
    </tr>
    <tr>
        <th>メールアドレス</th>
        <td th:text="${contactForm.email}"></td>
    </tr>
    <tr>
        <th>お問い合わせ内容</th>
        <td th:text="${contactForm.message}"></td>
    </tr>
</table>

<form th:action="@{/contact/submit}" th:object="${contactForm}" method="post">
    <input type="hidden" th:field="*{name}">
    <input type="hidden" th:field="*{email}">
    <input type="hidden" th:field="*{message}">
</form>

</body>
</html>
